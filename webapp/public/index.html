<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>WAV Playlists</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="card">
    <h1>WAV Playlists</h1>

    <section aria-labelledby="buttons-heading">
      <h2 id="buttons-heading">Buttons</h2>
      <div class="button-rows">
        <label class="button-label" for="button-red">
          <span class="swatch" data-color="red"></span>Red
        </label>
        <select id="button-red" data-color="red"></select>
        <label class="button-label" for="button-blu">
          <span class="swatch" data-color="blu"></span>Blue
        </label>
        <select id="button-blu" data-color="blu"></select>
        <label class="button-label" for="button-yel">
          <span class="swatch" data-color="yel"></span>Yellow
        </label>
        <select id="button-yel" data-color="yel"></select>
        <label class="button-label" for="button-grn">
          <span class="swatch" data-color="grn"></span>Green
        </label>
        <select id="button-grn" data-color="grn"></select>
      </div>
      <p id="buttons-status" class="status" role="status" aria-live="polite"></p>
    </section>

    <h2>Edit playlists</h2>
    <form id="playlist-form" novalidate>
      <div class="field">
        <label for="playlist-select">Playlist</label>
        <select id="playlist-select">
          <option value="">+ New playlist</option>
        </select>
        <p id="used-by-hint" class="hint used-by-hint"></p>
      </div>

      <div class="field">
        <label for="playlist-name">Label</label>
        <input id="playlist-name" type="text" maxlength="100" autocomplete="off"
               placeholder="e.g. My Playlist">
      </div>

      <div class="field">
        <div class="label-row">
          <label for="playlist-urls">WAV URLs</label>
          <span id="url-count" class="hint">0 URLs</span>
        </div>
        <textarea id="playlist-urls" rows="10" wrap="off" spellcheck="false"
                  autocapitalize="off" autocomplete="off"
                  placeholder="Paste one URL per line&#10;https://example.com/sound.wav"></textarea>
      </div>

      <div class="actions">
        <button type="submit" id="save-btn" class="primary">Save playlist</button>
        <button type="button" id="delete-btn" class="danger" disabled>Delete playlist</button>
      </div>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
